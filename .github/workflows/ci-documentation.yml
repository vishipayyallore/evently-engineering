name: Documentation Quality (Markdown & Links)

# Lints every tracked Markdown file against .markdownlint.json and checks all
# links (relative and external) with lychee, configured by lychee.toml.
# Doc surfaces: README / AGENTS / CLAUDE, docs/**, and the agent/skill/rule
# guides under .claude/** and .github/**.

on:
  push:
    paths:
      - '**.md'
      - '.markdownlint.json'
      - 'lychee.toml'
      - '.github/workflows/ci-documentation.yml'
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.json'
      - 'lychee.toml'
      - '.github/workflows/ci-documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare log directory
        run: mkdir -p .ci-logs

      - name: Run markdownlint-cli2
        run: |
          set -euo pipefail
          npx --yes markdownlint-cli2 \
            "**/*.md" \
            "#**/node_modules/**" \
            "#**/bin/**" \
            "#**/obj/**" 2>&1 | tee .ci-logs/markdownlint.log

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-documentation-logs
          path: .ci-logs/
          retention-days: 7

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Documentation CI summary"
            echo ""
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- markdown-lint status: \`${{ job.status }}\`"
            echo "- Config: \`.markdownlint.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

  link-check:
    name: Link checking (lychee)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --cache --max-cache-age 1d
            --no-progress
            './**/*.md'
            './.github/**/*.md'
            './.claude/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/out.md
          retention-days: 7
